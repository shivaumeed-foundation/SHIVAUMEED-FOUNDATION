<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 40" width="56" height="40">
  <rect width="56" height="40" rx="8" fill="#1a2e5a"/>
  <!-- Bank Pillar Building -->
  <g fill="#f2c96d" transform="translate(18, 9) scale(0.85)">
    <!-- Pediment (Roof) -->
    <polygon points="12,0 0,6 24,6"/>
    <!-- Architrave -->
    <rect x="1" y="7" width="22" height="1.8" rx="0.5"/>
    <!-- 4 Columns -->
    <rect x="2.5" y="9.5" width="2.8" height="10" rx="0.5"/>
    <rect x="8" y="9.5" width="2.8" height="10" rx="0.5"/>
    <rect x="13.5" y="9.5" width="2.8" height="10" rx="0.5"/>
    <rect x="19" y="9.5" width="2.8" height="10" rx="0.5"/>
    <!-- Base -->
    <rect x="0" y="20" width="24" height="2.5" rx="0.5"/>
  </g>
</svg>

